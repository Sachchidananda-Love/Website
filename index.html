    <script>
        const cursor = document.querySelector('.site-cursor');
        const normalCursorSrc = 'assets/img/cursor/cursor_1.png';
        const hoverCursorSrc = 'assets/img/cursor/cursorhover_1.png';
        new Image().src = hoverCursorSrc;
        const navigationImages = [...document.querySelectorAll('.title-navigation-link img[data-hover-src]')].map((image) => {
            const defaultSrc = image.getAttribute('src');
            const hoverSrc = image.dataset.hoverSrc;
            new Image().src = hoverSrc;

            return { image, link: image.closest('.title-navigation-link'), defaultSrc, hoverSrc, isHovering: false };
        });

        const setNavigationHover = (item, isHovering) => {
            if (item.isHovering === isHovering) return;
            item.image.src = isHovering ? item.hoverSrc : item.defaultSrc;
            item.isHovering = isHovering;
        };

        const cursorRadius = 16;
        const hoverOffset = 9 * (96 / 72);
        const cubeElement = document.querySelector('.portfolio-cube');
        let activeCubeCategory = null;

        cubeElement.addEventListener('click', (event) => {
            if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
            const visibleCubeMedia = cubeElement.querySelector('.portfolio-cube__face--front .is-visible');
            const visibleCubeSource = visibleCubeMedia?.getAttribute('src');
            if (visibleCubeSource) {
                try {
                    window.sessionStorage.setItem(
                        'infinite-gallery-entry-media',
                        visibleCubeSource.replace('assets/img/cube/', 'assets/img/')
                    );
                } catch {}
            }
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            event.preventDefault();
            document.body.classList.add('is-opening-gallery');
            window.setTimeout(() => window.location.assign(cubeElement.href), 2000);
        });

        window.addEventListener('pageshow', () => document.body.classList.remove('is-opening-gallery'));

        document.addEventListener('pointermove', (event) => {
            cursor.style.left = `${event.clientX}px`;
            cursor.style.top = `${event.clientY}px`;
            cursor.classList.add('site-cursor--visible');
            let closestItem = null;
            let closestDistance = Infinity;

            navigationImages.forEach((item) => {
                const rect = item.image.getBoundingClientRect();
                const nearestX = Math.max(rect.left, Math.min(event.clientX, rect.right));
                const nearestY = Math.max(rect.top, Math.min(event.clientY, rect.bottom));
                const distance = Math.hypot(event.clientX - nearestX, event.clientY - nearestY);
                if (distance < closestDistance) {
                    closestItem = item;
                    closestDistance = distance;
                }
            });

            const isNearNavigation = closestDistance <= cursorRadius + hoverOffset;
            const isOverCube = cubeElement && cubeElement.matches(':hover');
            navigationImages.forEach((item) => setNavigationHover(item, item === closestItem && isNearNavigation));
            cursor.src = isNearNavigation || isOverCube ? hoverCursorSrc : normalCursorSrc;

            const nextCubeCategory = isNearNavigation ? closestItem.link.dataset.cubeCategory : null;
            if (nextCubeCategory !== activeCubeCategory) {
                activeCubeCategory = nextCubeCategory;
                document.dispatchEvent(new CustomEvent('portfolio-cube-categorychange', { detail: { category: activeCubeCategory } }));
            }
        });

        navigationImages.forEach((item) => {
            item.link.addEventListener('focus', () => {
                setNavigationHover(item, true);
                document.dispatchEvent(new CustomEvent('portfolio-cube-categorychange', { detail: { category: item.link.dataset.cubeCategory } }));
            });
            item.link.addEventListener('blur', () => {
                setNavigationHover(item, false);
                document.dispatchEvent(new CustomEvent('portfolio-cube-categorychange', { detail: { category: null } }));
            });
        });
    </script>
