<!doctype html>
<html lang="en" class="infinite-gallery-document">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fefefe">
    <title>Infinite Gallery — Calem Anderson-Barwin</title>
    <link rel="stylesheet" href="assets/css/Better-Regular.css">
    <link rel="stylesheet" href="assets/css/infinite-gallery.css">
    <link rel="stylesheet" href="assets/css/site-loader.css">
</head>
<body class="infinite-gallery-page">
    <script src="assets/js/site-loader.js"></script>
    <a class="gallery-back" href="index.html" aria-label="Return to portfolio homepage">back</a>

    <main class="gallery-viewport" data-gallery-viewport tabindex="0" aria-label="Infinite artwork gallery. Drag or use the arrow keys to explore.">
        <div class="gallery-plane" data-gallery-plane></div>
        <p class="gallery-hint" aria-hidden="true">drag to explore</p>
        <p class="gallery-status" data-gallery-status aria-live="polite"></p>
    </main>

    <noscript>
        <p class="gallery-noscript">JavaScript is required to explore this gallery. <a href="index.html">Return home</a>.</p>
    </noscript>

    <dialog class="gallery-dialog" data-gallery-dialog>
        <button class="gallery-dialog__close" type="button" aria-label="Close artwork viewer">×</button>
        <div class="gallery-dialog__content" data-gallery-dialog-content></div>
    </dialog>

    <script src="assets/js/infinite-gallery-manifest.js"></script>
    <script src="assets/js/infinite-gallery.js"></script>
    <script src="assets/js/site-cursor.js"></script>
</body>
</html>
