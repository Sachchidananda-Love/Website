<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f6f2">
    <title>Paintings — Calem Anderson-Barwin</title>
    <link rel="stylesheet" href="assets/css/Better-Regular.css">
    <link rel="stylesheet" href="assets/css/paintings.css">
    <link rel="stylesheet" href="assets/css/site-loader.css">
</head>
<body>
    <script src="assets/js/site-loader.js"></script>
    <header class="paintings-header">
        <a class="paintings-back" href="index.html">back</a>
        <div class="paintings-header__content">
            <div>
                <h1>Paintings</h1>
                <p class="paintings-intro">Spray paint, ink, vinyl, glass, and acrylic works. Select a work to explore every available view.</p>
            </div>
            <form class="paintings-controls" data-paintings-controls aria-label="Filter and sort paintings">
                <details class="paintings-filter" data-filter-menu="availability"><summary>Availability <span>All works</span></summary><div class="paintings-filter__options"><label><input type="checkbox" name="availability" value="For Sale"> <span>For sale</span></label></div></details>
                <details class="paintings-filter" data-filter-menu="medium"><summary>Medium <span>All media</span></summary><div class="paintings-filter__options"><label><input type="checkbox" name="medium" value="Spray Paint"> <span>Spray paint</span></label><label><input type="checkbox" name="medium" value="Ink"> <span>Ink</span></label><label><input type="checkbox" name="medium" value="Vinyl"> <span>Vinyl</span></label><label><input type="checkbox" name="medium" value="Glass"> <span>Glass</span></label><label><input type="checkbox" name="medium" value="Acrylic"> <span>Acrylic</span></label></div></details>
                <details class="paintings-filter" data-filter-menu="subject"><summary>Subject <span>All subjects</span></summary><div class="paintings-filter__options"><label><input type="checkbox" name="subject" value="People"> <span>Faces</span></label><label><input type="checkbox" name="subject" value="Nature"> <span>Nature</span></label><label><input type="checkbox" name="subject" value="Abstract"> <span>Abstract</span></label><label><input type="checkbox" name="subject" value="Tendrils"> <span>Tendril</span></label><label><input type="checkbox" name="subject" value="Psychedelic"> <span>Psychedelic</span></label></div></details>
                <label>Sort by<select name="sort"><option value="default">Default order</option><option value="size-asc">Size: smallest to largest</option><option value="size-desc">Size: largest to smallest</option><option value="price-desc">Price: high to low</option><option value="price-asc">Price: low to high</option></select></label>
            </form>
        </div>
    </header>

    <main>
        <section class="paintings-grid" data-paintings-grid aria-label="Paintings"></section>
    </main>

    <template data-painting-template>
        <article class="painting-card">
            <div class="painting-card__media">
                <div class="painting-card__preview"></div>
            </div>
            <div class="painting-card__navigation" aria-label="Artwork views"></div>
            <div class="painting-card__body">
                <h2 class="painting-card__title"></h2>
                <p class="painting-card__details"></p>
                <p class="painting-card__description"></p>
                <ul class="painting-card__tags" aria-label="Artwork tags"></ul>
            </div>
        </article>
    </template>

    <dialog class="painting-dialog" data-painting-dialog>
        <button class="painting-dialog__close" type="button" aria-label="Close artwork">×</button>
        <div class="painting-dialog__content" data-painting-dialog-content></div>
    </dialog>

    <script src="assets/js/infinite-gallery-manifest.js"></script>
    <script src="assets/js/artwork-dialog-history.js"></script>
    <script src="assets/js/paintings.js"></script>
    <script src="assets/js/site-cursor.js"></script>
</body>
</html>
